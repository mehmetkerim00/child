### Почему сервер не принял событие поездки.
enum: RideFlowError
values:
  - rideFinished           ### поездка уже завершена или отменена
  - wrongOrder             ### этап не следует за текущим статусом
  - wrongCodeWord          ### кодовое слово семьи не совпало
  - handoverProofRequired  ### нет кода учреждения и подписи
  - reasonRequired         ### задержка и отказ требуют причину
  - unsupportedEvent       ### событие не может отметить водитель
