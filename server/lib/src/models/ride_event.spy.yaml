### Иммутабельный лог событий поездки.
class: RideEvent
table: ride_event
fields:
  rideId: int, relation(parent=ride, onDelete=Cascade)
  ### Идентификатор, присвоенный приложением водителя. Нужен, чтобы
  ### событие из офлайн-очереди не записалось дважды при повторной отправке.
  clientEventId: String
  ### Для «забрал» и «передал» в пуле — к какому ребёнку относится событие.
  childId: int?, relation(parent=child, onDelete=SetNull)
  type: RideEventType
  at: DateTime
  ### Кто отметил событие: driver или dispatcher.
  byRole: AccountRole
  lat: double?
  lng: double?
  photoUrl: String?
  ### Причина задержки, код учреждения и прочее — короткой строкой.
  note: String?
indexes:
  ride_event_ride_idx:
    fields: rideId
  ride_event_client_id_idx:
    fields: clientEventId
    unique: true
