# Пароли ТОЛЬКО для локальной разработки и тестов.
# cp config/passwords.example.yaml config/passwords.yaml
#
# Значения нарочно простые и совпадают с docker-compose.yaml: база поднимается
# на localhost и наружу не смотрит. Секреты staging/production сюда НЕ класть —
# они задаются переменными окружения на сервере (SERVERPOD_PASSWORD_*).

development:
  database: 'child_dev_password'
  redis: 'child_dev_redis'

  # The service secret is used to communicate between servers and to access the
  # service protocol.
  serviceSecret: 'child_dev_service_secret'

  jwtHmacSha512PrivateKey: 'child_dev_jwt_key'
  jwtRefreshTokenHashPepper: 'child_dev_jwt_pepper'
  # serverSideSessionKeyHashPepper: 'child_dev_session_pepper'

test:
  database: 'child_test_password'
  redis: 'child_test_redis'

  jwtHmacSha512PrivateKey: 'child_test_jwt_key'
  jwtRefreshTokenHashPepper: 'child_test_jwt_pepper'
  # serverSideSessionKeyHashPepper: 'child_test_session_pepper'
