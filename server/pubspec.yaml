name: child_server
description: Бэкенд проекта child (Serverpod + PostgreSQL).
publish_to: none

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  serverpod: 3.4.13
  serverpod_auth_core_server: 3.4.13

dev_dependencies:
  lints: ^6.0.0
  serverpod_test: 3.4.13
  test: ^1.25.6

serverpod:
  scripts:
    # Запуск сервера с применением миграций БД.
    start: dart bin/main.dart --apply-migrations

    # Собрать веб-панель диспетчера и положить её в web/app (отдаётся по /app).
    flutter_build:
      posix: |
        cd ../apps/dispatcher
        flutter build web --base-href /app/ --output ../../server/web/app
