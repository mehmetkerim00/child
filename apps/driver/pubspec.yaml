name: driver
description: "Приложение child: driver."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_auth:
    path: ../../packages/core_auth
  core_data:
    path: ../../packages/core_data
  core_domain:
    path: ../../packages/core_domain
  core_l10n:
    path: ../../packages/core_l10n
  core_ui:
    path: ../../packages/core_ui
  flutter_riverpod: ^2.6.1
  # Геолокация во время поездки: foreground service с уведомлением.
  geolocator: ^14.0.2
  go_router: ^17.0.0
  # Нативный SQLite для офлайн-очереди событий поездки (core_data).
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Иконка-заглушка: монограмма Sag-Aman. Дизайнерскую подставим позже —
# достаточно заменить файлы в assets/brand и перегенерировать:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../../assets/brand/icon.png"
  adaptive_icon_background: "#1E5AA8"
  adaptive_icon_foreground: "../../assets/brand/icon_foreground.png"
