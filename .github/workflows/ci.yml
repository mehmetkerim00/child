name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Репозиторий публичный: ключ или боевой пароль в коммите утечёт
  # навсегда. Проверка идёт первой и отдельно — её результат виден
  # сразу, не под конец сборки APK.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check_secrets.sh

  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - run: flutter pub get
      - run: ./tools/check.sh analyze
      # Полнота переводов — отдельным шагом: пропущенный ключ должен
      # быть виден в названии упавшего шага, а не в общей куче тестов.
      - name: Полнота переводов ru/tk/en
        working-directory: packages/core_l10n
        run: flutter test test/arb_completeness_test.dart
      - run: ./tools/check.sh test

  server-test:
    runs-on: ubuntu-latest
    env:
      SERVERPOD_PASSWORD_database: 'child_test_password'
      SERVERPOD_PASSWORD_redis: 'child_test_redis'
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 'child_test_jwt_key'
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'child_test_jwt_pepper'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - name: Postgres для тестов
        working-directory: server
        run: docker compose up -d --quiet-pull postgres_test redis_test
      - run: flutter pub get
      - name: Тесты сервера
        working-directory: server
        run: dart test
      - if: always()
        working-directory: server
        run: docker compose down -v

  build-apk:
    runs-on: ubuntu-latest
    needs: [analyze-test, secrets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - run: flutter pub get
      - name: APK родителя
        working-directory: apps/parent
        run: flutter build apk --debug --split-per-abi --dart-define=FLAVOR=dev
      - name: APK водителя
        working-directory: apps/driver
        run: flutter build apk --debug --split-per-abi --dart-define=FLAVOR=dev
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            apps/parent/build/app/outputs/flutter-apk/app-*-debug.apk
            apps/driver/build/app/outputs/flutter-apk/app-*-debug.apk
