# Боевой запуск Sag-Aman на туркменском хостинге.
#
# Разворачивается на одной машине: сервер, база и Redis в одной
# docker-сети. Наружу смотрит только обратный прокси с сертификатом —
# в запросах едут адреса детей и время, когда их забирают, и открытым
# текстом это ходить не должно.
#
#   cp .env.example .env   # заполнить пароли
#   docker compose -f docker-compose.prod.yaml up -d
#
# Подробно — deploy/README.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sagaman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD в .env}
    volumes:
      - sagaman_db:/var/lib/postgresql/data
      # Бэкапы кладём рядом: их забирает tools/backup_db.sh с хоста.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sagaman"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не открыт: база доступна только из docker-сети.
    expose:
      - "5432"

  redis:
    image: redis:6.2.6
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?нужен REDIS_PASSWORD в .env}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      runmode: production
      serverid: default
      logging: normal
      role: monolith
      # Пароли только через окружение: в репозитории их нет и быть не должно.
      SERVERPOD_PASSWORD_database: ${DB_PASSWORD}
      SERVERPOD_PASSWORD_redis: ${REDIS_PASSWORD}
      SERVERPOD_PASSWORD_serviceSecret: ${SERVICE_SECRET}
      # Ошибки — в Sentry, если он поднят; иначе в логи контейнера.
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      # Только на localhost: наружу выпускает прокси, он же держит TLS.
      - "127.0.0.1:8080:8080"   # API приложений
      - "127.0.0.1:8081:8081"   # Insights, наружу не нужен никогда
      - "127.0.0.1:8082:8082"   # веб: кабинет учреждения, /health
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sagaman_db:
