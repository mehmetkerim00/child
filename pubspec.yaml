name: child_workspace
publish_to: none

environment:
  sdk: ^3.10.0

# Dart pub workspace: одна общая резолюция зависимостей на весь монорепо.
workspace:
  - apps/parent
  - apps/driver
  - apps/dispatcher
  - packages/core_domain
  - packages/core_data
  - packages/core_ui
  - packages/core_l10n
  - packages/child_client
  - server

dev_dependencies:
  melos: ^8.9.0

# melos 7+ хранит конфиг здесь (melos.yaml больше не используется).
melos:
  repository: https://github.com/childapp/child
  scripts:
    analyze:
      description: Статический анализ всех пакетов
      run: melos exec -c 1 -- dart analyze --fatal-infos .
    format:
      description: Проверка форматирования
      run: dart format --output=none --set-exit-if-changed .
    test:
      description: Все тесты, кроме серверных (им нужна БД)
      run: melos run test:dart && melos run test:flutter
    test:dart:
      description: Тесты пакетов на чистом Dart
      run: melos exec -c 1 --no-flutter --dir-exists=test --ignore=child_server -- dart test
    test:flutter:
      description: Тесты Flutter-пакетов и приложений
      run: melos exec -c 1 --flutter --dir-exists=test -- flutter test
    test:server:
      description: Интеграционные тесты сервера (нужен docker compose up -d)
      run: melos exec --scope=child_server -- dart test
    generate:server:
      description: serverpod generate (модели, эндпоинты, клиент)
      run: melos exec --scope=child_server -- serverpod generate
    build:apk:
      description: Debug-APK обоих мобильных приложений
      run: melos exec -c 1 --scope=parent --scope=driver -- flutter build apk --debug
